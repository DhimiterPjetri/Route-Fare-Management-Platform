<mat-card class="dialog-container">
  <mat-card-header class="dialog-header">
    <mat-card-title class="centered-title">{{ getTitle() }}</mat-card-title>
    <button mat-icon-button mat-dialog-close class="close-button">
      <mat-icon>close</mat-icon>
    </button>
  </mat-card-header>

  <mat-card-content class="dialog-content">
    <div *ngIf="error" class="error-message">
      <mat-icon>error</mat-icon>
      <span>{{ error }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput 
               formControlName="name" 
               placeholder="Enter booking class name">
        <mat-error>{{ getFieldError('name') }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Code</mat-label>
        <input matInput 
               formControlName="code" 
               placeholder="Enter booking class code"
               style="text-transform: uppercase;">
        <mat-error>{{ getFieldError('code') }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Display Order</mat-label>
        <input matInput 
               type="number"
               formControlName="displayOrder" 
               placeholder="Enter display order (1-100)">
        <mat-error>{{ getFieldError('displayOrder') }}</mat-error>
      </mat-form-field>

      <div class="status-field">
        <mat-checkbox formControlName="isActive" color="primary">
          Booking Class is Active
        </mat-checkbox>
        <div class="status-help">
          <mat-icon class="help-icon">info</mat-icon>
          <span>Inactive booking classes cannot be assigned to tour operators</span>
        </div>
      </div>
    </form>
  </mat-card-content>

  <mat-card-actions class="dialog-actions">
    <button mat-button (click)="onCancel()" [disabled]="isLoading">
      Cancel
    </button>
    <button mat-raised-button 
            color="primary" 
            (click)="onSubmit()"
            [disabled]="isLoading || form.invalid">
      <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
      <span *ngIf="!isLoading">{{ getSubmitButtonText() }}</span>
      <span *ngIf="isLoading">{{ getSubmitButtonText() }}</span>
    </button>
  </mat-card-actions>
</mat-card>
