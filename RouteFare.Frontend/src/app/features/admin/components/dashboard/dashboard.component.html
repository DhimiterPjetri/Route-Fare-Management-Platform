<div class="dashboard-container">
  <app-page-header></app-page-header>
  
  <div class="dashboard-content">

  <div class="dashboard-grid">
    @for (card of dashboardCards; track card.title) {
      <mat-card 
        class="dashboard-card"
        [style.border-left-color]="card.color"
        (click)="card.action()"
        tabindex="0">
        
        <mat-card-header>
          <div mat-card-avatar [style.background-color]="card.color">
            <mat-icon>{{ card.icon }}</mat-icon>
          </div>
          <mat-card-title>{{ card.title }}</mat-card-title>
          <mat-card-subtitle>{{ card.description }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-actions align="end">
          <button mat-button [style.color]="card.color">
            MANAGE
            <mat-icon>arrow_forward</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
  </div>
</div>
